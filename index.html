<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#c4162c">
<title>Aspect</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6e6e8;--panel:#ffffff;--ink:#2a0a0f;--bot:#fff5f6;--ac:#c4162c;--line:#c98a92;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12050a;--panel:#26080e;--ink:#fbe9ea;--bot:#3a1017;--ac:#e0243a;--line:#7a1622}}
:root[data-theme="dark"]{--bg:#12050a;--panel:#26080e;--ink:#fbe9ea;--bot:#3a1017;--ac:#e0243a;--line:#7a1622}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:Tajawal,system-ui,sans-serif;font-size:16px;overflow:hidden}
#app{height:100%;display:flex;flex-direction:column;max-width:720px;margin:auto}
header{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--panel);border-bottom:3px solid var(--line)}
#av{width:48px;height:48px;border-radius:12px;border:2px solid var(--ac);flex:none;animation:fl 3s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-4px) rotate(2deg)}}
@media(prefers-reduced-motion:reduce){#av{animation:none}}
h1{font:700 20px/1.2 Tajawal,sans-serif;letter-spacing:4px;margin:0;flex:1}
h1 small{display:block;font:12px Tajawal,sans-serif;opacity:.7;margin-top:4px}
button,select,input,textarea{font:inherit;color:var(--ink);background:var(--bot);border:2px solid var(--line);padding:8px 10px;border-radius:0;min-width:0}
button{cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.pri{background:var(--ac);color:#fff;font-weight:700}
#v{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:8px}.row>input{flex:1}
.col{display:flex;flex-direction:column;gap:8px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}.chips button{white-space:nowrap}
.chips .on{background:var(--ac);color:#fff}
.card{background:var(--bot);border:2px solid var(--line);padding:10px 12px;display:flex;flex-direction:column;gap:6px;cursor:pointer}
.card.dim{opacity:.55}
.sub{font-size:14px;opacity:.8}
.tag{background:var(--ac);color:#fff;padding:1px 8px;font-size:13px}
.empty{text-align:center;opacity:.7;margin:20px 0}
h2{margin:6px 0 0;font-size:16px}
nav{display:flex;border-top:3px solid var(--line);background:var(--panel)}
nav button{flex:1;border:0;background:none;padding:12px 0;font-size:11px}
nav button[aria-current="true"]{background:var(--ac);color:#fff;font-weight:700}
#md{position:fixed;inset:0;background:#000b;display:none;z-index:5;overflow-y:auto}
#md.on{display:block}
.sheet{background:var(--panel);margin:calc(10px + env(safe-area-inset-top,0px)) 10px 20px;padding:12px;display:flex;flex-direction:column;gap:8px;border:3px solid var(--line)}
.chk{display:flex;gap:8px;align-items:center}.chk input{width:20px;height:20px}
#ob{position:fixed;inset:0;background:var(--bg);display:none;z-index:20;overflow-y:auto}#ob.on{display:block}#vt{position:fixed;inset:0;background:var(--bg);display:none;z-index:25;overflow-y:auto}#vt.on{display:block}
.yt{background:var(--bot);border:1px solid var(--line)}.yth{aspect-ratio:16/9;background:#000 center/cover;color:#aaa;display:flex;align-items:center;justify-content:center;font-size:13px}.yrow{display:flex;gap:8px;padding:8px;align-items:flex-start}.yav{width:32px;height:32px;border-radius:50%;background:var(--ac);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;flex:none}.ytt{font-weight:700;font-size:14px;line-height:1.4;overflow-wrap:anywhere}
#tt{position:fixed;left:50%;transform:translateX(-50%);top:calc(12px + env(safe-area-inset-top,0px));background:var(--ac);color:#fff;padding:10px 14px;z-index:9;display:none;max-width:90%;font-weight:700}
</style></head><body>
